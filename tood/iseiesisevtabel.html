<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Iseseisevtabel</title>
    <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<table id="iseseisev">
    <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
        <td rowspan="4">5</td>
        <td rowspan="2" colspan="4">6</td>
    </tr>
    <tr>
        <td colspan="4">7</td>
    </tr>
    <tr>
        <td colspan="4">12</td>
        <td>8</td>
        <td>9</td>
        <td>10</td>
        <td>11</td>
    </tr>
    <tr>
        <td rowspan="4" colspan="4">15</td>
        <td colspan="3">13</td>
        <td>14</td>
    </tr>
    <tr>
        <td>16</td>
        <td colspan="4" rowspan="2">17</td>
    </tr>
    <tr>
        <td rowspan="2">19</td>
        <td colspan="4" rowspan="2"></td>
    </tr>
    <tr>
        <td colspan="4">18</td>
        <td colspan="4">20</td>
    </tr>
</table>
</body>
</html>
